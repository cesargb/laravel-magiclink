name: static analysis

on:
  push:
      paths:
          - '**.php'
          - 'phpstan.neon.dist'
          - '.github/workflows/static-analysis.yml'

  pull_request:
      paths:
          - '**.php'
          - 'phpstan.neon.dist'
          - '.github/workflows/static-analysis.yml'

jobs:
  phpstan:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
      with:
        php-version: 8.3

    - name: Install composer dependencies
      uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda

    - name: Install larastan
      run: |
        composer require "larastan/larastan" --no-interaction --no-update
        composer update --prefer-dist --no-interaction

    - name: Run analyse phpstan
      run: vendor/bin/phpstan analyse --error-format github
